/* ==========================================================================
   ١) الخلفيات والألوان  —  عدّل هنا فقط إذا أردت تغيير مظهر الصفحة
   كل سطر أدناه لوحة كاملة. غيّر قيمة --bg و --bg-2 لتغيير الخلفية،
   و --card للبطاقة، و --text للنص. لإضافة لوحة جديدة: انسخ سطرًا،
   غيّر اسمه بين علامتي التنصيص، ثم أضف اسمه في قائمة THEMES بأسفل الملف.
   ========================================================================== */

[data-theme="sand"]  { --bg:#EFEBE3; --bg-2:#E3DCD0; --card:#F9F7F3; --text:#3A3630; --muted:#7E7669; --line:#E2DBCF; --ink:#2C2A26; --shadow:26 22 16; }
[data-theme="stone"] { --bg:#EDEDEC; --bg-2:#DFDFDE; --card:#F8F8F8; --text:#38383A; --muted:#78787C; --line:#E0E0E0; --ink:#2A2A2C; --shadow:20 20 22; }
[data-theme="sage"]  { --bg:#E7EBE5; --bg-2:#D8DFD5; --card:#F5F7F3; --text:#343A33; --muted:#71796F; --line:#DCE2D9; --ink:#272C26; --shadow:18 24 18; }
[data-theme="mist"]  { --bg:#E8EBEE; --bg-2:#D8DEE4; --card:#F5F7F9; --text:#33383D; --muted:#6F767E; --line:#DCE1E6; --ink:#262A2F; --shadow:16 20 26; }
[data-theme="clay"]  { --bg:#EFE7E2; --bg-2:#E1D3CB; --card:#F9F4F1; --text:#3D352F; --muted:#83766C; --line:#E4D8D0; --ink:#2E2823; --shadow:28 20 16; }
[data-theme="night"] { --bg:#1A1A19; --bg-2:#111110; --card:#232322; --text:#DCD7CD; --muted:#8C867B; --line:#32322F; --ink:#E4DFD5; --shadow:0 0 0; }

/* الوضع التلقائي: يتبع إعداد النظام (فاتح/داكن) */
[data-theme="auto"]  { --bg:#EFEBE3; --bg-2:#E3DCD0; --card:#F9F7F3; --text:#3A3630; --muted:#7E7669; --line:#E2DBCF; --ink:#2C2A26; --shadow:26 22 16; }
@media (prefers-color-scheme: dark) {
  [data-theme="auto"] { --bg:#1A1A19; --bg-2:#111110; --card:#232322; --text:#DCD7CD; --muted:#8C867B; --line:#32322F; --ink:#E4DFD5; --shadow:0 0 0; }
}

/* ==========================================================================
   ٢) التنسيق العام
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 40px 16px;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color: var(--text);
  background-color: var(--bg);
  background-image:
    radial-gradient(1100px 600px at 50% -10%, var(--card) 0%, transparent 60%),
    linear-gradient(175deg, var(--bg) 0%, var(--bg-2) 100%);
  background-attachment: fixed;
  transition: background-color .35s ease, color .35s ease;
}

/* ---------- البطاقة ---------- */

.card {
  width: 100%;
  max-width: 480px;
  margin-top: 56px;
  padding: 0 28px 34px;
  text-align: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 26px;
  box-shadow:
    0 1px 2px rgb(var(--shadow) / .05),
    0 12px 32px -12px rgb(var(--shadow) / .14);
  transition: background .35s ease, border-color .35s ease;
}

.avatar {
  width: 112px;
  height: 112px;
  margin: -56px auto 0;
  display: block;
  border-radius: 50%;
  object-fit: cover;
  background: var(--bg-2);
  border: 5px solid var(--card);
  box-shadow: 0 6px 20px -8px rgb(var(--shadow) / .3);
  transition: border-color .35s ease;
}

h1 {
  margin: 20px 0 0;
  font-size: clamp(1.55rem, 5.5vw, 1.95rem);
  font-weight: 600;
  letter-spacing: -.015em;
  line-height: 1.2;
}

.role {
  margin: 9px 0 0;
  font-size: .95rem;
  font-weight: 400;
  line-height: 1.55;
  color: var(--muted);
}

.place {
  display: block;
  margin-top: 2px;
  font-size: .85rem;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--muted);
  opacity: .8;
}

/* ---------- الفاصل ---------- */

.divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 26px 0 22px;
  font-size: .72rem;
  font-weight: 500;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
}
.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}

/* ---------- أيقونات التواصل ---------- */

.links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  --glyph: 23px;        /* المقاس الأساس للشعار داخل القالب */
  gap: 10px;
  max-width: 340px;     /* ٦ أيقونات في كل صف */
  margin: 0 auto;
  padding: 0;
  list-style: none;
}

.links a,
.links .inactive {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--line);
  text-decoration: none;
  transition: color .2s ease, background-color .2s ease, border-color .2s ease, transform .2s ease;
}

/* كل أيقونة تملأ قالبها: المقاس الأساس مضروبًا في معامل --k المحسوب لكل
   شعار من نسبة عرضه إلى ارتفاعه ومن كثافة حبره، حتى تتساوى بصريًا */
.links svg {
  width: calc(var(--glyph) * var(--k, 1));
  height: calc(var(--glyph) * var(--k, 1));
  fill: currentColor;
  display: block;
}

.links a:hover,
.links a:focus-visible {
  color: var(--brand, var(--ink));
  background: color-mix(in srgb, var(--brand, var(--ink)) 11%, transparent);
  border-color: color-mix(in srgb, var(--brand, var(--ink)) 28%, transparent);
  transform: translateY(-2px);
}

.links a:focus-visible {
  outline: 2px solid var(--brand, var(--ink));
  outline-offset: 3px;
}

.email-link {
  position: fixed;
  top: 16px;
  inset-inline-start: 16px;
  z-index: 10;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 38px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--muted);
  font-size: .78rem;
  font-weight: 500;
  text-decoration: none;
  opacity: .72;
  transition: opacity .2s ease, color .2s ease;
}
.email-link svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.email-link:hover,
.email-link:focus-visible {
  opacity: 1;
  color: var(--text);
}
.email-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 3px;
}

/* ---------- التذييل ---------- */

footer {
  margin: 26px 0 0;
  font-size: .75rem;
  letter-spacing: .05em;
  color: var(--muted);
  opacity: .75;
}

/* ==========================================================================
   ٣) مبدّل الخلفية
   ========================================================================== */

.theme {
  position: fixed;
  top: 16px;
  inset-inline-end: 16px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 8px;
}

.theme__btn {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--muted);
  cursor: pointer;
  opacity: .72;
  transition: opacity .2s ease, color .2s ease, transform .2s ease;
}
.theme__btn:hover, .theme__btn:focus-visible { opacity: 1; color: var(--text); }
.theme__btn svg { width: 17px; height: 17px; fill: currentColor; }

.theme__panel {
  display: flex;
  gap: 7px;
  padding: 7px 9px;
  border-radius: 999px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: 0 8px 24px -12px rgb(var(--shadow) / .3);
  opacity: 0;
  transform: translateX(8px) scale(.96);
  transform-origin: right center;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.theme__panel[data-open="true"] { opacity: 1; transform: none; pointer-events: auto; }

.swatch {
  width: 22px;
  height: 22px;
  padding: 0;
  border-radius: 50%;
  border: 1px solid rgb(0 0 0 / .12);
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease;
}
.swatch:hover { transform: scale(1.14); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--text); }
.swatch:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

/* ==========================================================================
   ٤) الاستجابة وتفضيلات الحركة
   ========================================================================== */

@media (max-width: 420px) {
  body { padding: 28px 14px; }
  .card { padding: 0 20px 28px; border-radius: 22px; }
  .links a, .links .inactive { width: 43px; height: 43px; }
  .links { gap: 8px; max-width: 306px; --glyph: 21px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>

<script>
/* ==========================================================================
   ٥) قائمة الخلفيات  —  أضف أو احذف من هنا بعد إضافة اللوحة في CSS بالأعلى
   name = الاسم في CSS، dot = لون الدائرة في المبدّل، label = التسمية
   ========================================================================== */
var THEMES = [
  { name: "auto",  dot: "linear-gradient(135deg,#EFEBE3 50%,#1A1A19 50%)", label: "Auto"  },
  { name: "sand",  dot: "#E7E0D4", label: "Sand"  },
  { name: "stone", dot: "#E2E2E1", label: "Stone" },
  { name: "sage",  dot: "#DCE2D7", label: "Sage"  },
  { name: "mist",  dot: "#DBE1E7", label: "Mist"  },
  { name: "clay",  dot: "#E6D8D0", label: "Clay"  },
  { name: "night", dot: "#1F1F1E", label: "Night" }
];
var DEFAULT_THEME = "night";

(function () {
  var root  = document.documentElement;
  var panel = document.getElementById("themePanel");
  var btn   = document.getElementById("themeBtn");
  var KEY   = "ibnkabed:theme";

  var names = THEMES.map(function (t) { return t.name; });
  var saved;
  try { saved = localStorage.getItem(KEY); } catch (e) { saved = null; }
  var current = names.indexOf(saved) > -1 ? saved : DEFAULT_THEME;
  root.setAttribute("data-theme", current);

  THEMES.forEach(function (t) {
    var s = document.createElement("button");
    s.type = "button";
    s.className = "swatch";
    s.style.background = t.dot;
    s.title = t.label;
    s.setAttribute("aria-label", t.label);
    s.setAttribute("aria-pressed", String(t.name === current));
    s.addEventListener("click", function () {
      current = t.name;
      root.setAttribute("data-theme", current);
      try { localStorage.setItem(KEY, current); } catch (e) {}
      panel.querySelectorAll(".swatch").forEach(function (o) {
        o.setAttribute("aria-pressed", String(o === s));
      });
    });
    panel.appendChild(s);
  });

  function open(state) {
    panel.setAttribute("data-open", String(state));
    btn.setAttribute("aria-expanded", String(state));
  }
  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    open(panel.getAttribute("data-open") !== "true");
  });
  document.addEventListener("click", function (e) {
    if (!panel.contains(e.target)) open(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") open(false);
  });

  document.getElementById("year").textContent = new Date().getFullYear();
})();
</script>
